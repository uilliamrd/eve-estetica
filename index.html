<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éve Estética</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #17140f;
    color: #f7f1e6;
    font-family: Georgia, 'Times New Roman', serif;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 480px; }
  .mark {
    width: 84px;
    height: 84px;
    margin: 0 auto 28px;
    color: #d4b483;
  }
  .script { font-family: 'Brush Script MT', cursive; font-size: 30px; fill: #d4b483; }
  .word { font-family: Georgia, serif; font-size: 8px; letter-spacing: 4px; fill: #f7f1e6; }
  h1 {
    font-weight: 400;
    font-style: italic;
    font-size: 1.5rem;
    letter-spacing: 0.02em;
    margin-bottom: 12px;
  }
  p {
    font-family: Arial, sans-serif;
    font-weight: 300;
    font-size: 0.95rem;
    color: rgba(247, 241, 230, 0.7);
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 160 160" role="img" aria-label="Éve Estética">
      <circle cx="80" cy="80" r="76" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="80" cy="80" r="68" fill="none" stroke="currentColor" stroke-width="0.8"/>
      <text x="80" y="76" text-anchor="middle" class="script">Éve</text>
      <text x="80" y="108" text-anchor="middle" class="word">ESTÉTICA</text>
    </svg>
    <h1>Site temporariamente fora do ar.</h1>
    <p>Estamos com uma atualização em andamento. Volte em breve.</p>
  </div>
</body>
</html>
